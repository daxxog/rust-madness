[workspace]
resolver = "2"
members = ["crates/nfm-core", "crates/nfm-dump", "crates/nfm-render", "crates/nfm-web"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
nfm-core = { path = "crates/nfm-core" }
