# The pixel platform's committed fontconfig mapping.
#
# WHY: the original only ever asks for new Font("SansSerif", 1, 13) and
# new Font("SansSerif", 1, 11) (grep-verified: every site is in
# reference/vineflower/xtGraphics.java), and the 2005-era platform font is
# gone. This file maps the logical sansserif family (all five logical fonts,
# in fact - see allfonts below) onto the ONE shipped bold face,
# tools/fonts/LiberationSans-Bold.ttf (Liberation Sans 2.1.5, SIL OFL, sha256
# 788abee4c806d660e8aee46689dd8540cd4bb98da03dcc9d171ce3efd99a9173), so the
# raster is reproducible on the container image. Era-exactness is
# approximate; reproducibility is exact.
#
# MECHANISM (verified on eclipse-temurin:8-jdk / OpenJDK 1.8.0_512, the
# image tools/pixel-tests.Dockerfile builds):
#   -Dsun.awt.fontconfig=/w/tools/fonts/fontconfig.properties
# is honoured: sun.awt.FontConfiguration.findFontConfigFile() reads that
# property, and sun.awt.X11FontManager.createFontConfiguration() only falls
# back to the fontconfig-synthesised (FcFontConfiguration) mapping when the
# configured file is absent OR fontFilesArePresent() fails. fontFilesArePresent()
# checks the FIRST logical font's first style/script slot, so a sansserif-only
# file is silently discarded; the allfonts line below makes that check pass for
# every logical font. When the property is absent the JDK uses the OS fontconfig
# (DejaVu Sans) and the raster-equality probe in tests/pixel/PixelSuite.java
# fails - which is the pin that proves this mapping is live.
#
# The filename is an ABSOLUTE container path: the repo is mounted read-only at
# /w by tools/pixel-tests.sh (so the font rides the mount and is never baked
# into the image).
#
# Format: JDK 8 "version 1" component-font-mapping properties file.

# format version understood by sun.awt.FontConfiguration
version=1

# Every logical font, every style, latin script -> the one component alias.
# The "allfonts" form (rather than per-font sansserif.bold.alphabetic lines)
# is what makes fontFilesArePresent() pass; the game only asks for
# SansSerif bold 11/13, and nothing else on this platform should pick a
# different (host-dependent) face.
allfonts.alphabetic=-nfmsansbold

# The component alias's real file. Absolute path inside the container.
filename.-nfmsansbold=/w/tools/fonts/LiberationSans-Bold.ttf

# The X11 font directory for heavyweights that render through the server.
# The suite draws only into BufferedImage offscreens, but AWT's platform font
# path bookkeeping expects this when the file uses an absolute filename.
awtfontpath.alphabetic=/w/tools/fonts

# Primary search sequence: the latin component only.
sequence.allfonts=alphabetic
