# audio.toml - the eleven stage tracks (tests/fixtures/toml/README.md).
#
# Single source of truth for TAudioGoldens (Java) and the Rust AudioBus
# tests. Transcribed verbatim from tests/java/TAudioGoldens.java (the class
# is the gate-proven record); values are immutable once the suite re-freezes.
#
# SOURCES
#   - per-stage RadicalMod args: reference/vineflower/xtGraphics.java:1249-1324
#     (lines cited per row below). The ctor is
#     `new RadicalMod(path, gain, rate, bpm, app)`; RadicalMod.java:39 forwards
#     `new ModSlayer(mod, var3, var2, var4)` and ModSlayer.java:505-512 is
#     `(Mod, samplingrate, gain, bpm)`, so the 2nd arg is the GAIN and the 3rd
#     the RATE (verified in B1/B2, documented in TAudioGoldens' class comment).
#   - decode: Mod + ModSlayer -> turnbytes() (ModSlayer.java:553-621) ->
#     the exact byte[] RadicalMod's ctor stores in stream
#     (RadicalMod.java:41-43).
#   - mix: the device-free per-call pump. play() -> AudioPlayer.player.start()
#     (RadicalMod.java:63-76, :70) -> 8u40 AudioDevice.openChannel wraps the
#     stream in `new BufferedInputStream(in, 1024)` (bytecode offsets 242-253)
#     -> 1024-byte call = 1024 ULAW samples. SuperStream.read fills exactly
#     len and resets on EOF (SuperStream.java:18-31), so one pass is
#     ceil(decode_bytes / 1024) calls = ceil(...) * 1024 bytes.
#   - bpm_samples: startplaying's `samplingrate / (24*bpm/60)`, integer
#     division (ModSlayer.java:784); read BEFORE turnbytes because Fxx
#     retunes it mid-song (get_track case 15, ModSlayer.java:759-769).
#
# STAGES 4 AND 7 share the args (300, 7500, 125) but are DIFFERENT ASSETS:
# stage4.zipo and stage7.zipo decode to different lengths and md5s.
#
# DEVICE QUIRK (B13 §1.2, §8): the 8u40 fallback format is hardcoded
# `new AudioFormat(ULAW, 8000.0f, 8, 1, 1, 8000.0f, true)` (offsets
# 303-318), so playback ignores the render rate: stage2/stage11 (9000) run
# ~12.5% fast and 7900/8100/8400/8500 land slightly off. Original behavior,
# pinned on this build, mirrored - not improved.

# One row per stage, in stage1..stage11 order (the `id` key carries the
# pin prefix; TAudioGoldens pins the ordered id list as a shape pin).
# Keys:
#   path, gain, rate, bpm      RadicalMod ctor args
#   decode_bytes, decode_md5   turnbytes() golden (pin ids _decode_len/_decode_md5)
#   mix_calls, mix_samples     ceil(decode_bytes/1024) and calls*1024 (pin _mix_samples)
#   mix_md5                    md5 of the concatenated 1024-byte call payloads
#   num_tracks                 mod.numtracks == slayer.numtracks (pin _tracks/_slayer_tracks)
#   num_patterns               mod.getNumPatterns() and mod.patterns.length (pin _numpatterns/_pattern_rows)
#   song_length_patterns       mod.song_length_patterns (pin _song_length)
#   song_repeat_patterns       mod.song_repeat_patterns (pin _song_repeat)
#   instruments                mod.insts.length (pin _instruments; every stage zipo is 31-instrument)

[[stage]]
id = "stage1"
path = "music/stage1.zipo"           # xtGraphics.java:1250
gain = 350                           # :1250
rate = 8400                          # :1250
bpm = 135                            # :1250
decode_bytes = 1191330
decode_md5 = "f1f2a25eb468517faa2218cf1712395f"   # the standing Java==Rust digest
mix_calls = 1164
mix_samples = 1191936
mix_md5 = "469e28bc8d70c72beb16d0973c13c0c4"
num_tracks = 4
num_patterns = 20
song_length_patterns = 20
song_repeat_patterns = 0
instruments = 31
bpm_samples = 155

