drawstat_green_mid = 186      # max=100/hit=50 -> 186.646 truncated (B10 correction)
drawstat_green_low = 11       # the other channels at the same point
drawstat_green_high = 244     # hit clamped to max -> green 244
drawstat_blue = 11
pause_band_row = 106          # :1159 - var8 > 550*(106+var5)+156
pause_band_grey_index = 156   # strictly greater: +156 stays grey
pause_band_first_tint = 157   # first tinted pixel
kbload_newsun = 514           # :2959-2962 var4==2
dnload_newsun = 485           # :2966-3152 summed var4==2
kbload_default = 416          # :2959-2962 default sound dir
dnload_default = 387          # :2966-3151 default sound dir
cntwis_dest = 8               # :1540-1552 - dest && cntwis==8 "you were wasted"
starcnt_start = 90            # resetstat :2634; the fase-0 ==90 camera reset
starcnt_landing = 35          # :1050-1069 / stat :1719 - the 35 landing/clamp
starcnt_visible = 34          # first visible HUD frame after the landing
starcnt_two = 24              # :1719-1745 countdown clips fire at 35/24/13/2
starcnt_one = 13
starcnt_go = 2
starcnt_race = 0              # first physics pass
gocnt_start = 3               # resetstat :2635
gocnt_two = 2                 # :1723-1745
gocnt_one = 1
gocnt_go = 0
