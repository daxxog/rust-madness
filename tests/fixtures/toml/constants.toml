# constants.toml - the load-bearing game constants (tests/fixtures/toml/README.md)
#
# Single source of truth for the magic integers/floats the behavior T-classes
# assert or drive with. The B-docs (notes/JAVA-BEHAVIOR/B*.md) are the
# narrative record; this file is normative (README: on conflict the TOML wins).
#
# SCOPE RULE (README): a literal lives here when it is (a) pinned as an
# expected value, (b) drives a scenario, or (c) a game-behavior constant the
# port must mirror. Test-internal scaffolding (loop bounds over local arrays,
# the recorder's "str ... x,y color" wrappers, fixture geometry indices) stays
# in the Java class. Each domain block notes its source class/lines and the
# consumer T-class that loads it.
#
# Transcribed verbatim from the consumers; the gates are the proof.

# ── Madness: drive physics, collisions, tricks, powerups ──────────────────
# Source: reference/vineflower/Madness.java (cites below), notes B9.
# Consumer: TMadnessDrive, TMadness, TMadnessWorld, TControl (via [control]).
[madness]
power_default = 75            # Madness.java:111 - ctor power (reseto installs 98)
power_reset = 98              # Madness.java:639
power_decay_divisor = 2500000 # Madness.java:49 powerloss[0]; :2407 power -= power^3/div
wall_recoil_cap = 300.0       # Madness.java:458-473,500-514 - the ±300 push/revpush clamps
colide_push_walk = 2000.0     # the four-pair push walk 800 -> 2000 (Madness.java:450-551; B9)
colide_pairs = 4              # per-wheel-pair push repetitions (Madness.java:450)
mxz_gap = 30                  # Madness.java:1167 - <30 -> quarter step
mxz_divisor = 4               # Madness.java:1168 - cxz += gap/4
mxz_step = 10                 # Madness.java:1171-1177 - else ±10
mxz_wrap_result = 350         # fixture (cxz 0, mxz 200) -> +360 then -10 (Madness.java:1160-1177)
capsize_detect = 90           # Madness.java:746 - |pzy| normalized >90
capsize_wrap = 270            # Madness.java:741 - while |angle| >270 subtract 360
capsize_full = 360            # the 400 -> 40 normalization (pzy=400-360)
capsize_over = 400            # the >270 loop probe (TMadnessDrive u41)
capsize_respawn_ticks = 30    # Madness.java:2392-2398 - capcnt reaches 30
capsize_flip = -50            # Madness.java:50 flipy[0]; :2395 y += flipy[cn]
capsnap_band_lo = 170         # Madness.java:1944 - pzy/pxy in (170,190) snap to 180
capsnap_band_hi = 190
capsnap_probe = 175           # pinned fixture inside the band
capsnap_result = 180
capsnap_deadband = 10         # Madness.java:2011 - |pxy - xy| >= 4; fixture pxy 5 -> 0
powerup_trav_threshold = 90   # Madness.java:2307,2313,2325 - |trav|>90 uses the divide arm
powerup_travxy_div = 24.0     # :2308
powerup_travzy_div = 18.0     # :2314,2326
powerup_travxz_div = 18.0     # :2326
powerup_rtab = 30             # :2309-2311
powerup_ftab = 40             # :2316-2318
powerup_btab = 40             # :2320-2322
powerup_surfer = 30           # :2328-2330
powerup_clamp = 98.0          # :2342
powerup_xt_threshold = 150    # :2344 - powerup>150 -> xtpower 200, else 100
powerup_xt_high = 200         # :2345
powerup_xt_low = 100          # :2347
cotchinow_min = 60            # :2334 - powerup > 60 gates cotchinow
cotchinow_caught = 300        # Record.java:653 - caught >= 300
cotchinow_whenwasted = 225    # Madness.java:2337
trick_rotate = 135            # :2271-2281 - |travxy|>135 / travzy ±135
trick_probe_delta = 5         # pinned 130 = rotate - 5
trick_ticks = 7               # the 7-tick right-hold pump (TMadnessDrive j)
ground_clamp = 245            # :1418 - var21 > 245 triggers the ground clamp
ground_y = 250                # :1418 - clamp target
ground_probe_y = 240          # pinned fixture that touches ground on tick 0
ground_lift = 7               # :1190 - scy lift (+7)
ground_bounce = 1.2           # bounce[0]; :1515-1522 - scy -= |scy*bounce|
ground_fall_floor = 1.1       # :1516-1517
focus_scan_len = 140          # CheckPoints typ[] length; the focus walk typ[140] AIOOBE edge (B9)
checkpoint_far = 800          # :2194 - dist > 800 -> missedcp 1
checkpoint_near = 400         # :2200 - dist < 400 clears -2
checkpoint_very_near = 250    # :2204 - dist < 250 -> 68
capsize_impulse_gate = 70     # :2381 - |scx|,|scz| < 70 arms the capcnt counter
destruction_hitmag = 4000     # :2076 - > maxmag[0] 3500
destruction_maxmag = 3500     # :53 maxmag[0]
destruction_cntdest = 7       # :2078-2079 - cntdest reaches 7 -> dest
damage_record_gate = 100      # :123,291,651 - |damage| > 100 records/hits
trick_srfcnt_cap = 10         # :2290 - srfcnt < 10
trcnt_powerup_arm = 9         # :2332 - trcnt == 9 computes powerup
trcnt_reset = 10              # :2352-2364 - trcnt 10 resets the trick counters
lastcolido_decay = 1          # :2421-2423

