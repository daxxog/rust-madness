camera_vxz_landing = 180
camera_around_adv_step = 20   # Medium.around :334-396 - adv -= 20 above the flex arm
camera_around_vxz_step = 4    # vxz += 4

# ── ContO: draw gate and dust impulse boundary ───────────────────────────
# Source: reference/vineflower/ContO.java, notes B6.
# Consumer: TContO, TContODraw.
[conto]
maxr_draw_gate = 241          # :520 - xs(maxR,0)=8*maxR-1925 > 0
pdust_impulse = 100           # :119-120 - scx/smag float->int +/-Infinity boundary
pdust_draws = 16              # :124-143 - two random draws per polygon vertex

# ── Plane: deltaf/projf geometry ─────────────────────────────────────────
# Source: reference/vineflower/Plane.java, notes B5.
# Consumer: TPlane.
[plane]
deltaf_3_4_5 = 1200.0         # :201-223 - 3*4*5*3*4*5/3
projf_3_4_5 = 1200.0          # :47-71 - x/z 3-4-5
projf_zero = 0.0
deltaf_sample_bits = 892531967 # :201-223 sample plane bit pattern (B5/TPlane pin)
av_far = 3000                 # :834-840 - av>3000 with adv<=900 forces noline
av_probe = 565                # the tracked-plane sample (TPlane dtrk_control_plain_av_565)

# ── Wheels: the procedural wheel generator ───────────────────────────────
# Source: reference/vineflower/Wheels.java, notes B3.
# Consumer: TWheels, TSmall.
[wheels]
slots_per_wheel = 9           # :44 + eight rims :60-162
hub_vertices = 8              # :44
rim_vertices = 4              # :60..:162
hub_half_span = 4             # :24-26 - var5 -/+ 4*var16
rim_y = 12                    # :28-43,48-59 - var6 +/- 12*var17
rim_z = 5                     # :28-43 - var7 +/- 5
ground_bias = 1               # :118-120 - (int)(y + 12*yScale + 1)
ground_abs_special = 73       # :17-20 - |var5| == 73 -> gr -1
trackers_slots = 500          # Trackers.java:2-13 - the 500-slot ring (TSmall)

# ── Record: recorder window and damage threshold ─────────────────────────
# Source: reference/vineflower/Record.java, notes B4.
# Consumer: TRecord, TMadnessWorld.
[record]
cntf = 50                     # :4 - the shared re-shift counter
ring_slots = 7                # :637-639 - damage ring wraps at 7
ring_last = 6                 # slot 6 is the last used before the wrap
frames = 300                  # [300][5] frame-major arrays
hist_slot = 299               # :581-589 - newest frame insert
part_slots = 4                # parts 0..3
damage_threshold = 100        # reg* guard: |damage| > 100

# ── GameSparker: the drivesounds gate and boot cadence ───────────────────
# Source: reference/vineflower/GameSparker.java, notes B8.
# Consumer: TGameSparkerLogic, PixelRace.
[gamesparker]
playsounds_starcnt_gate = 35  # :758 - fase==0 && starcnt<35
loadhold = 80                 # :607-631 default loadhold (gameprfact == -1)
factor_default = 35           # :607 - default factor
fase_start = 111              # xtGraphics.java:25 / GameSparker boot arm
carselect_gatey = 100         # :3598-3602 - pgate gatey decrement step

# ── ModSlayer: the turnbytes safety cap ──────────────────────────────────
# Source: reference/vineflower/ModSlayer.java, notes B2.
# Consumer: TModEdges.
[modslayer]
turnbytes_cap = 3500000       # :598-603 - output stops at 3.5M samples

# ── the audio device boundary (8u40 AudioDevice) ─────────────────────────
# Source: sun.audio AudioDevice bytecode (B13 §1.1); notes B13.
# Consumer: TAudioGoldens.
[audio_device]
rate = 8000                   # ULAW fallback rate (bytecode offsets 303-318)
frame_bytes = 1024            # BufferedInputStream(in, 1024); one read = 1024 samples
ms_per_call = 128             # 1024 samples / 8000 Hz

